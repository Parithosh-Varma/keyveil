openapi: 3.0.3
info:
  title: KeyVeil Blind Gateway
  version: 0.2.0
  description: >
    Agents use secrets without seeing them via proxy tools. Human sessions
    carry full rights on their own account; Bearer agent keys need explicit
    scopes (secrets:reveal, keys:manage, audit:read).
servers:
  - url: https://keyveil-api.parithosh.workers.dev
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200': { description: ok }
  /v1/tools:
    get:
      summary: List allowed blind tools
      responses:
        '200': { description: tools }
  /v1/whoami:
    get:
      summary: Session/key identity (session or Bearer)
      responses:
        '200': { description: user_id, via, scopes }
        '401': { description: login required / invalid token }
  /v1/secrets:
    get:
      summary: List secret names (metadata only, session or Bearer)
      responses:
        '200': { description: secrets }
    post:
      summary: Store/overwrite a secret (AES-GCM server-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name: { type: string }
                value: { type: string }
      responses:
        '200': { description: stored }
  /v1/secrets/{name}:
    get:
      summary: Reveal a value — needs secrets:reveal scope, audit-logged
      security: [{ bearer: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: name + value }
        '403': { description: scope denied }
        '404': { description: no such secret }
    delete:
      summary: Delete a secret (session or Bearer)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: deleted }
  /v1/agent-keys:
    get:
      summary: List key metadata — needs keys:manage scope (never hashes)
      responses:
        '200': { description: keys }
    post:
      summary: Create a key — full token shown once, needs keys:manage scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
                ip_allowlist: { type: array, items: { type: string } }
                ttl_days: { type: number }
      responses:
        '200': { description: id, token (once), prefix, scopes }
  /v1/agent-keys/{id}/revoke:
    post:
      summary: Revoke a key — needs keys:manage scope
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: revoked }
  /v1/audit:
    get:
      summary: Last 100 events — needs audit:read scope (no secret values)
      responses:
        '200': { description: audit }
  /v1/auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '200': { description: ok }
  /v1/auth/grant:
    post:
      summary: Trade a one-time login grant for a session bearer (cookie-less frontends)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: session_token (Bearer sess_...) }
        '401': { description: invalid or expired grant }
  /v1/proxy/github/create-repo:
    post:
      summary: Create GitHub repo (injects GITHUB_TOKEN server-side)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                isPublic: { type: boolean }
      responses:
        '200': { description: repo url only, never token }
  /v1/proxy/openai/chat:
    post:
      summary: OpenAI chat (injects OPENAI_API_KEY server-side)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string }
                input: { type: string }
      responses:
        '200': { description: model result only }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: tv_live_...
