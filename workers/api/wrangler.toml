name = "keyveil-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
WEB_BASE_URL = "https://www.keyveil.run.place"
DASHBOARD_URL = "https://dashboard.keyveil.run.place"

# Fill these after `wrangler d1 create` / `wrangler kv:namespace create`
[[d1_databases]]
binding = "DB"
database_name = "keyveil-db"
database_id = "a86d1d76-a9cd-4a23-abcb-d0d4fd9b016e"

# [[kv_namespaces]]
# binding = "VEIL_KV"
# id = "PASTE_KV_ID"

# Production secrets (never commit): set via
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put SESSION_SECRET
#   wrangler secret put ENCRYPTION_KEK
