name = "api-tokens-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
WEB_BASE_URL = "https://yourdomain.com"

# Fill these after `wrangler d1 create` / `wrangler kv:namespace create`
# [[d1_databases]]
# binding = "DB"
# database_name = "api-tokens-db"
# database_id = "PASTE_D1_ID"

# [[kv_namespaces]]
# binding = "VAULT_KV"
# id = "PASTE_KV_ID"

# Production secrets (never commit): set via
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put SESSION_SECRET
#   wrangler secret put ENCRYPTION_KEK
